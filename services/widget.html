<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px sans-serif;background:#fff;color:#333}
#w{display:flex;align-items:center;height:240px;background:#fff}
#ring{width:236px;height:236px;flex:none}
#t{padding:0 6px 0 2px}
#clk{font-weight:700;color:#555}
#st{font-size:16px;font-weight:700;margin:4px 0}
.m{color:#555;margin:3px 0}
#old{background:#ff6d00;color:#000;padding:2px 4px;border-radius:4px;margin-top:4px}
</style></head><body><div id="w">
<svg id="ring" viewBox="-115 -115 230 230" font-family="sans-serif" font-weight="700" text-anchor="middle"></svg>
<div id="t"><div id="clk"></div><div id="st"></div><div class="m" id="nx"></div><div class="m" id="du"></div>
<div id="old" hidden>Дані застаріли. Запитайте графік ще раз.</div></div>
</div><script>
// PURE-BEGIN: pure functions, no DOM and no clock; tests/test_widget.py runs them in node.
const SLOT = 18e5, DAY = 864e5, H = 36e5;
// Kyiv UTC offset in ms: EU rule, +3 from the last Sunday of March 01:00 UTC to the last Sunday of October 01:00 UTC, else +2.
// ponytail: hard-coded EU DST rule; if Ukraine drops DST, send the offset in public_data instead.
function lastSun(y, mo) { const d = Date.UTC(y, mo + 1, 0); return d - new Date(d).getUTCDay() * DAY + H; }
function kyivOffset(n) { const y = new Date(n).getUTCFullYear(); return n >= lastSun(y, 2) && n < lastSun(y, 9) ? 3 * H : 2 * H; }
// Wall clock: Kyiv local time written as UTC ms. Slots are wall-clock half hours, so DST days keep their labels.
function wall(n) { return n + kyivOffset(n); }
function wallMs(n, t) { return wall(n) - wall(t * 1e3); }
function slotIndex(n, t, len) { const i = Math.floor(wallMs(n, t) / SLOT); return i < 0 || i >= len ? -1 : i; }
function stateAt(s, i) { return i < 0 || i >= s.length ? 0 : +s[i]; }
// Same rules as get_next_event_info(): "on" counts only directly after "off" or "possible".
function nextChange(s, i) {
  const c = s[i] || '0';
  for (let k = i + 1; k < s.length; k++) {
    const x = s[k];
    if (x != c && x != '0' && !(x == '1' && s[k - 1] != '2' && s[k - 1] != '3')) return k;
  }
  return -1;
}
// Real ms until wall-clock slot j starts (the offset may change before it).
function timeLeftMs(n, t, j) { const w = wall(t * 1e3) + j * SLOT, r = w - kyivOffset(n); return w - kyivOffset(r) - n; }
function runLength(s, j) { let k = j; while (k < s.length && s[k] == s[j]) k++; return k - j; }
function pad(x) { return (x < 10 ? '0' : '') + x; }
function slotLabel(j) { const m = j % 48 * 30; return pad(m / 60 | 0) + ':' + pad(m % 60) + (j >= 48 && j < 96 ? ' завтра' : ''); }
function formatLeft(ms) { const s = Math.max(0, Math.floor(ms / 1e3)); return (s / 3600 | 0) + ':' + pad((s / 60 | 0) % 60) + ':' + pad(s % 60); }
function offHours(s, d) { const p = s.slice(d * 48, d * 48 + 48); return p.length < 48 ? null : (p.split('2').length - 1) / 2; }
function isStale(n, t, len) { return slotIndex(n, t, len) < 0; }
function parseData(x, r) {
  try { const d = JSON.parse(x); return d && typeof d.s == 'string' && typeof d.t == 'number' && !((d.r || 0) < r) ? d : null; }
  catch (e) { return null; }
}
// "Коло (Прогноз)" from image_generator._generate_circle_view(dynamic=True). m = minutes since day 0 midnight.
// Clock face 00:00 at the top: before the hand it shows tomorrow, after the hand it shows today.
// Returns merged arcs [fromMin, toMin, state] on the 0..1440 face.
function merge(a) { const r = []; for (const x of a) { const p = r[r.length - 1]; if (p && p[1] == x[0] && p[2] == x[2]) p[1] = x[1]; else r.push(x); } return r; }
function faceArcs(s, m) {
  const d = Math.floor(m / 1440), cm = m - d * 1440, T = s.slice(d * 48, d * 48 + 48), N = s.slice(d * 48 + 48, d * 48 + 96), a = [];
  for (let k = 0; k < 48; k++) {
    const x = k * 30, y = x + 30, n = N[k] || '0', t = T[k] || '0';
    if (y <= cm) a.push([x, y, n]); else if (x >= cm) a.push([x, y, t]); else a.push([x, cm, n], [cm, y, t]);
  }
  return merge(a);
}
// Outer thin arc after the hand: tomorrow's state where it differs (off/possible, or on where today is off/possible).
function overlayArcs(s, m) {
  const d = Math.floor(m / 1440), cm = m - d * 1440, T = s.slice(d * 48, d * 48 + 48), N = s.slice(d * 48 + 48, d * 48 + 96), a = [];
  for (let k = 0; k < 48; k++) {
    const x = Math.max(k * 30, cm), y = k * 30 + 30, n = N[k] || '0', t = T[k] || '0';
    if (y > x && n != t && n != '0' && (n != '1' || t == '2' || t == '3')) a.push([x, y, n]);
  }
  return merge(a);
}
// PURE-END
const TW = window.TelegramWidget || {}, $ = id => document.getElementById(id);
const NAMES = ['Немає даних', 'Світло є', 'Світла немає', 'Можливе відключення'];
const COL = ['#9E9E9E', '#4CAF50', '#D32F2F', '#81D4FA'];
let D = null, raw, lastM = -1;
const P = (x, r) => { const a = x / 720 * Math.PI; return (Math.sin(a) * r).toFixed(1) + ',' + (-Math.cos(a) * r).toFixed(1); };
function arc(x, y, r1, r2, c) {
  // Split long arcs: SVG drops an arc whose ends meet (a full 0..1440 ring).
  if (y - x > 720) return arc(x, x + 720, r1, r2, c) + arc(x + 720, y, r1, r2, c);
  return '<path fill="' + c + '" d="M' + P(x, r2) + 'A' + r2 + ' ' + r2 + ' 0 0 1 ' + P(y, r2) + 'L' + P(y, r1) + 'A' + r1 + ' ' + r1 + ' 0 0 0 ' + P(x, r1) + 'Z"/>';
}
const line = (x, r1, r2, c, w) => '<path d="M' + P(x, r1) + 'L' + P(x, r2) + '" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round"/>';
function drawRing(m) {
  // Radii follow the image: ring 0.6..1.0, overlay 1.02..1.08, hand 0.55..1.05 (1.0 = 100).
  let h = '';
  for (const [x, y, c] of faceArcs(D.s, m)) h += arc(x, y, 60, 100, COL[c]);
  for (const [x, y, c] of overlayArcs(D.s, m)) h += arc(x, y, 102, 108, COL[c]);
  for (let i = 0; i < 24; i++) {
    h += line(i * 60, 60, 100, '#fff', .8);
    const p = P(i * 60 + 30, 80).split(',');
    h += '<text x="' + p[0] + '" y="' + (+p[1] + 4) + '" font-size="10" fill="#fff">' + pad(i) + '</text>';
  }
  const cm = (m % 1440 + 1440) % 1440, e = P(cm, 105).split(','), day = new Date(wall(D.t * 1e3) + Math.floor(m / 1440) * DAY).toISOString();
  h += line(cm, 55, 105, '#2196F3', 4) + '<circle cx="' + e[0] + '" cy="' + e[1] + '" r="4.5" fill="#2196F3" stroke="#fff" stroke-width="2"/>';
  h += line(0, 55, 105, '#fff', 4);
  h += '<text y="-8" font-size="18" fill="#333">' + String(D.q).replace(/[<&]/g, c => c == '<' ? '&lt;' : '&amp;') + '</text><text y="12" font-size="11" fill="#555">Прогноз (24 год)</text>';
  h += '<text y="26" font-size="8" font-weight="400" fill="grey">' + day.slice(8, 10) + '.' + day.slice(5, 7) + '.' + day.slice(0, 4) + '</text>';
  $('ring').innerHTML = h;
}
function tick() {
  const x = TW.publicData;
  if (x !== raw) { raw = x; const d = parseData(x, D ? D.r || 0 : 0); if (d) { D = d; lastM = -1; } }
  if (!D) { $('st').textContent = NAMES[0]; return; }
  const n = Date.now(), i = slotIndex(n, D.t, D.s.length), c = stateAt(D.s, i);
  const j = i < 0 ? -1 : nextChange(D.s, i), w = wallMs(n, D.t), m = Math.floor(w / 6e4);
  $('clk').textContent = formatLeft((w % DAY + DAY) % DAY);
  $('st').textContent = NAMES[c];
  $('st').style.color = COL[c];
  $('nx').textContent = j < 0 ? (i < 0 ? '' : 'Змін не заплановано') : 'Зміна о ' + slotLabel(j) + ', через ' + formatLeft(timeLeftMs(n, D.t, j));
  $('du').textContent = j < 0 ? '' : 'Далі: ' + NAMES[stateAt(D.s, j)] + ', ' + runLength(D.s, j) / 2 + ' год';
  $('old').hidden = !isStale(n, D.t, D.s.length);
  if (m !== lastM) { lastM = m; drawRing(m); }
}
if (TW.onEvent) TW.onEvent('publicDataChanged', tick);
if (TW.watchPublicData) TW.watchPublicData();
tick();
setInterval(tick, 1e3);
</script></body></html>
